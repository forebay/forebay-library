name: Parity

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  parity:
    uses: intisy/workflows/.github/workflows/test.yml@main
    with:
      toolchains: node
      runners: '["ubuntu-latest","windows-latest"]'
      node_install: npm ci --prefix parity/typescript
      node_build: ''
      node_test: npm test --prefix parity/typescript
