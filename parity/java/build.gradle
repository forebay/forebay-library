plugins {
    id "java"
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
}

def weivel = "0.0.0-dev"

configurations {
    libraryTypeGenerator
}

dependencies {
    libraryTypeGenerator "io.github.intisy:jvm-seam:${weivel}"

    testImplementation "io.github.intisy:jvm-seam:${weivel}"
    testImplementation "io.github.intisy:annotations:${weivel}"
    testImplementation "com.google.code.gson:gson:2.10.1"
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.1"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

def parityDirectory = file("..")
def generatedTypes = layout.buildDirectory.dir("generated/library-types")
def pinnedDeclaration = layout.buildDirectory.file("pinned/library.json")

def pinFile = new File(parityDirectory, "pin.json")

def sha256Of = { File file ->
    java.security.MessageDigest.getInstance("SHA-256").digest(file.bytes).collect { String.format("%02x", it & 0xff) }.join()
}

// The service interface is generated from the declaration the pinned release ships, fetched from the
// release and held to the digest in pin.json, so the test exercises the generator a Java embedder
// uses on the declaration of the binary it loads, whatever this working tree declares.
def fetchPinnedDeclaration = tasks.register("fetchPinnedDeclaration") {
    inputs.file pinFile
    outputs.file pinnedDeclaration
    doLast {
        def pin = new groovy.json.JsonSlurper().parse(pinFile, "UTF-8")
        def source = "https://github.com/" + pin.repository + "/releases/download/" + pin.tag + "/library.json"
        def target = pinnedDeclaration.get().asFile
        target.parentFile.mkdirs()
        target.bytes = new URL(source).bytes
        def actual = sha256Of(target)
        if (actual != pin.sha256["library.json"]) {
            target.delete()
            throw new GradleException(source + " has SHA-256 " + actual + " but parity/pin.json pins " + pin.sha256["library.json"])
        }
    }
}

def generateAppsService = tasks.register("generateAppsService", JavaExec) {
    dependsOn fetchPinnedDeclaration
    classpath = configurations.libraryTypeGenerator
    mainClass = "io.github.intisy.ai.seam.jvm.library.LibraryTypeGenerator"
    def output = generatedTypes.get().asFile
    args pinnedDeclaration.get().asFile.absolutePath, output.absolutePath, "io.github.forebay.library.parity"
    inputs.file pinnedDeclaration
    outputs.dir output
    doFirst {
        project.delete(output)
    }
}
sourceSets.test.java.srcDir(generateAppsService)

// The cases, divergences and expected answers are read off disk at run time, so Gradle is told
// about them, or a changed expectation would answer UP-TO-DATE.
tasks.named("test") {
    useJUnitPlatform()
    systemProperty "parity.directory", parityDirectory.absolutePath
    inputs.dir new File(parityDirectory, "cases")
    inputs.file new File(parityDirectory, "divergences.json")
    inputs.file pinFile
    inputs.property "parityCases", System.getenv("PARITY_CASES") ?: ""
    inputs.dir(new File(parityDirectory, "expected")).optional()
    testLogging {
        events "passed", "failed"
        showStandardStreams = true
        exceptionFormat = "full"
    }
}
